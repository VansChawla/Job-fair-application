<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Online Job Fair Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Smooth page fade-in animation */
        body {
            animation: fadeIn 0.8s ease-in;
            background-color: #f8f9fa;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Navbar hover animation */
        .navbar {
            transition: background-color 0.3s ease;
        }
        .navbar:hover {
            background-color: #004aad !important;
        }

        /* Button animations */
        .btn {
            transition: all 0.3s ease-in-out;
            border-radius: 25px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        }

        /* Card hover animation */
        .card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: none;
            border-radius: 15px;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        /* Section header animation */
        h3.mb-3 {
            position: relative;
            display: inline-block;
            padding-bottom: 5px;
        }

        h3.mb-3::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0%;
            height: 3px;
            background-color: #0d6efd;
            transition: width 0.4s ease;
        }

        h3.mb-3:hover::after {
            width: 100%;
        }

        /* Footer styling */
        footer {
            font-weight: 500;
            letter-spacing: 0.3px;
            animation: fadeInUp 1s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Subtle glow for title */
        header h1 {
            text-shadow: 1px 1px 6px rgba(13, 110, 253, 0.3);
            animation: slideIn 0.8s ease;
        }

        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Footer hover glow */
        footer:hover {
            background-color: #0a58ca;
            transition: all 0.4s ease;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Online Job Fair</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="./login.html">Login</a></li>
                <li class="nav-item"><a class="nav-link" href="./register.html">Register</a></li>
            </ul>
        </div>
    </div>
</nav>

<header class="bg-light py-5 text-center">
    <h1 class="text-primary mb-3">Welcome to Online Job Fair Portal</h1>
    <p class="text-secondary">Connecting job seekers and recruiters through digital job fairs</p>
</header>

<section class="container my-4">
    <h3 class="mb-3 text-primary">Latest Job Postings</h3>
    <div class="row" th:each="job : ${jobs}">
        <div class="col-md-4 mb-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 th:text="${job.title}" class="fw-bold"></h5>
                    <p th:text="${job.companyName}" class="text-muted"></p>
                    <p><i class="bi bi-geo-alt-fill text-primary"></i> <span th:text="${job.location}"></span></p>
                    <a th:href="@{'/jobs/' + ${job.id}}" class="btn btn-primary btn-sm mt-2">View Details</a>
                </div>
            </div>
        </div>
    </div>
</section>

<footer class="bg-primary text-white text-center p-3">
    © 2025 Online Job Fair Portal | Digital Employment Exchange <br>
    <small>Developed by <strong>Arhit</strong> | <strong>Sudhanshu</strong> | <strong>Krishna</strong> | <strong>Vansh</strong> | <strong>Arjun</strong></small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

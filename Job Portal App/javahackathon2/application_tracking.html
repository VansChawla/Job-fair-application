<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Application Tracking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f3f6fa;
            font-family: 'Poppins', sans-serif;
        }

        .container {
            margin-top: 60px;
            animation: fadeIn 1s ease-in-out;
        }

        h3 {
            color: #0d6efd;
            font-weight: 600;
            margin-bottom: 25px;
            text-align: center;
        }

        table {
            border-radius: 10px;
            overflow: hidden;
            background: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        thead {
            background: linear-gradient(90deg, #0d6efd, #5a9eff);
            color: white;
            font-weight: 500;
        }

        th, td {
            vertical-align: middle !important;
            text-align: center;
            padding: 14px;
        }

        tbody tr {
            transition: all 0.3s ease;
        }

        tbody tr:hover {
            background-color: #e8f0ff;
            transform: scale(1.01);
            box-shadow: 0 2px 10px rgba(13, 110, 253, 0.2);
        }

        td:first-child {
            font-weight: 500;
            color: #333;
        }

        td:nth-child(3) {
            font-weight: 600;
        }

        .status-pending {
            color: #ff9800;
        }

        .status-approved {
            color: #28a745;
        }

        .status-rejected {
            color: #dc3545;
        }

        footer {
            margin-top: 60px;
            background: #0d6efd;
            color: white;
            text-align: center;
            padding: 12px;
            font-size: 0.9rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h3>Track Your Job Applications</h3>
    <table class="table table-bordered align-middle">
        <thead>
            <tr>
                <th>Job Title</th>
                <th>Company</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody th:each="app : ${applications}">
            <tr>
                <td th:text="${app.job.title}">Software Developer</td>
                <td th:text="${app.job.companyName}">TechCorp</td>
                <td th:text="${app.status}"
                    th:classappend="${app.status == 'Pending'} ? 'status-pending' :
                                    ${app.status == 'Approved'} ? 'status-approved' :
                                    'status-rejected'">Pending</td>
            </tr>
        </tbody>
    </table>
</div>

<footer>
    © 2025 Online Job Fair Portal | Designed by ARHIT | SUDHANSHU | KRISHNA | VANSH | ARJUN
</footer>

</body>
</html>

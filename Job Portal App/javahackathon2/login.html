<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Login - Online Job Fair</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Background Gradient with Floating Light Effect */
    body {
      background: linear-gradient(135deg, #007bff, #00c6ff);
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      color: #333;
    }

    /* Floating Glow Orbs */
    body::before, body::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      animation: floatOrb 10s infinite ease-in-out alternate;
    }

    body::before {
      width: 200px; height: 200px;
      top: 10%; left: 15%;
    }

    body::after {
      width: 300px; height: 300px;
      bottom: 10%; right: 10%;
      animation-delay: 2s;
    }

    @keyframes floatOrb {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-30px) scale(1.1); }
    }

    /* Glassmorphism Card */
    .login-card {
      width: 380px;
      padding: 35px 30px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(15px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      animation: fadeIn 1s ease-in-out;
    }

    .login-card h3 {
      text-align: center;
      font-weight: 700;
      color: #fff;
      margin-bottom: 25px;
      letter-spacing: 0.5px;
    }

    .form-label {
      font-weight: 500;
      color: #eaeaea;
    }

    .form-control, .form-select {
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.9);
      border: none;
      padding: 10px 12px;
      transition: all 0.3s ease;
    }

    .form-control:focus, .form-select:focus {
      box-shadow: 0 0 12px rgba(0, 123, 255, 0.4);
      transform: scale(1.02);
    }

    /* Button */
    .btn-login {
      background: linear-gradient(90deg, #00c6ff, #007bff);
      border: none;
      border-radius: 10px;
      padding: 10px 0;
      font-weight: 600;
      color: white;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
    }

    .btn-login:hover {
      background: linear-gradient(90deg, #007bff, #00c6ff);
      transform: scale(1.05);
      box-shadow: 0 4px 18px rgba(0, 123, 255, 0.4);
    }

    /* Link styling */
    .text-center a {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .text-center a:hover {
      text-decoration: underline;
      color: #cce5ff;
    }

    footer {
      position: absolute;
      bottom: 10px;
      width: 100%;
      text-align: center;
      color: #ffffffcc;
      font-size: 0.9rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h3>Welcome Back</h3>
    <form th:action="@{/login}" method="post">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" placeholder="Enter your email" required/>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Enter your password" required/>
      </div>
      <div class="mb-3">
        <label class="form-label">Role</label>
        <select name="role" class="form-select" required>
          <option value="">Select your role</option>
          <option value="candidate">Candidate</option>
          <option value="company">Company</option>
        </select>
      </div>
      <button class="btn btn-login w-100">Login</button>
    </form>

    <p class="text-center mt-3">
      Don’t have an account? <a href="/register">Register</a>
    </p>
  </div>

  <footer>
    © 2025 Online Job Fair Portal | Designed by ARHIT | SUDHANSHU | KRISHNA | VANSH | ARJUN
  </footer>
</body>
</html>

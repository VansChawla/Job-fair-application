<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Post a Job - JobFair</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-white shadow-sm">
    <div class="container">
      <a class="navbar-brand text-primary" th:href="@{/}">JobFair+</a>
    </div>
  </nav>

  <main class="container py-4">
    <div class="card p-4 shadow-sm">
      <h4 th:text="${job != null} ? 'Edit Job' : 'Post a New Job'">Post a New Job</h4>
      <form th:action="@{${job != null} ? '/company/jobs/' + ${job.id} + '/update' : '/company/jobs/create'}"
            method="post" th:object="${jobForm}">
        <div class="row g-3 mt-2">
          <div class="col-md-6">
            <label class="form-label">Job Title</label>
            <input th:field="*{title}" class="form-control" placeholder="e.g., Backend Developer" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Role</label>
            <input th:field="*{role}" class="form-control" placeholder="Full-time / Internship" required>
          </div>

          <div class="col-12">
            <label class="form-label">Description</label>
            <textarea th:field="*{description}" rows="4" class="form-control" placeholder="Describe the position" required></textarea>
          </div>

          <div class="col-md-6">
            <label class="form-label">Eligibility Criteria</label>
            <input th:field="*{eligibility}" class="form-control" placeholder="Min qualification, CGPA">
          </div>
          <div class="col-md-6">
            <label class="form-label">Expected Skills / Experience</label>
            <input th:field="*{skills}" class="form-control" placeholder="Java, Spring Boot, SQL">
          </div>

          <div class="col-md-6">
            <label class="form-label">Location</label>
            <input th:field="*{location}" class="form-control" placeholder="City / Remote">
          </div>
          <div class="col-md-6">
            <label class="form-label">Notes / Additional Info</label>
            <input th:field="*{notes}" class="form-control" placeholder="Any other info or link">
          </div>
        </div>

        <div class="mt-4 d-flex justify-content-end">
          <a th:href="@{/company/dashboard}" class="btn btn-outline-secondary me-2">Cancel</a>
          <button class="btn btn-primary" type="submit">Save Job</button>
        </div>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Apply - JobFair</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-white shadow-sm">
    <div class="container">
      <a class="navbar-brand text-primary" th:href="@{/}">JobFair+</a>
    </div>
  </nav>

  <main class="container py-4">
    <div class="card p-4 shadow-sm">
      <div>
        <h4 th:text="${job.title}">Backend Developer</h4>
        <div class="small text-muted" th:text="${job.company.name}">ACME Corp</div>
      </div>

      <form th:action="@{|/jobs/${job.id}/apply|}" method="post" th:object="${applicationForm}" class="mt-3">
        <h6>Short Fit Questions</h6>
        <p class="small text-muted">Answer these to help recruiters understand fit.</p>

        <div class="mb-3" th:each="q,iterStat : ${questions}">
          <label class="form-label" th:for="${'q' + iterStat.index}" th:text="${iterStat.index + 1} + '. ' + ${q}">1. Years of experience?</label>
          <input th:id="${'q' + iterStat.index}" th:name="${'answers[' + iterStat.index + ']'}" class="form-control" required>
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" th:field="*{confirm}" id="confirmApply" required>
          <label class="form-check-label" for="confirmApply">I confirm that information provided is accurate.</label>
        </div>

        <div class="d-flex justify-content-end">
          <a th:href="@{/jobs}" class="btn btn-outline-secondary me-2">Back</a>
          <button class="btn btn-primary" type="submit">Submit Application</button>
        </div>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

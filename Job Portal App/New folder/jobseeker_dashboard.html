<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Candidate Dashboard - JobFair</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-white shadow-sm">
    <div class="container d-flex justify-content-between">
      <a class="navbar-brand text-primary" th:href="@{/}">JobFair+</a>
      <div>
        <a class="btn btn-outline-secondary me-2" th:href="@{/seeker/profile}">Edit Profile</a>
        <a class="btn btn-danger" th:href="@{/logout}">Logout</a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row g-3">
      <div class="col-lg-4">
        <div class="card p-3">
          <div class="d-flex align-items-center">
            <div class="avatar bg-primary text-white rounded-circle me-3">
              <span th:text="${seeker.name.substring(0,1)}">S</span>
            </div>
            <div>
              <h5 class="mb-0" th:text="${seeker.name}">Student Name</h5>
              <div class="small text-muted" th:text="${seeker.education}">B.Tech, CSE</div>
            </div>
          </div>

          <hr class="my-3"/>
          <h6 class="small text-muted">Resume</h6>
          <div th:if="${seeker.resumePath != null}">
            <a th:href="@{${seeker.resumePath}}" target="_blank" class="d-block text-decoration-none">
              View Resume
            </a>
          </div>
          <form th:action="@{/seeker/resume/upload}" enctype="multipart/form-data" method="post" class="mt-3">
            <input type="file" name="resume" accept="application/pdf" class="form-control form-control-sm mb-2" required />
            <button class="btn btn-sm btn-primary w-100" type="submit">Upload PDF</button>
          </form>
        </div>

        <div class="card p-3 mt-3">
          <h6>Quick Links</h6>
          <ul class="list-unstyled small">
            <li><a th:href="@{/jobs}">Browse Jobs</a></li>
            <li><a th:href="@{/events}">View Events</a></li>
            <li><a th:href="@{/seeker/applications}">My Applications</a></li>
          </ul>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="card p-3">
          <h5>Recommended Jobs</h5>
          <div th:if="${jobs != null and !#lists.isEmpty(jobs)}">
            <div class="row g-3">
              <div class="col-md-6" th:each="job : ${jobs}">
                <div class="card h-100 job-card">
                  <div class="card-body">
                    <h6 class="fw-semibold" th:text="${job.title}">Backend Engineer</h6>
                    <div class="small text-muted" th:text="${job.company.name}">ACME Corp</div>
                    <p class="small mt-2" th:text="${job.description}">Short summary...</p>
                  </div>
                  <div class="card-footer bg-white d-flex justify-content-between align-items-center">
                    <div class="small text-muted" th:text="${job.location}">Remote</div>
                    <a th:href="@{|/jobs/${job.id}/apply|}" class="btn btn-sm btn-primary">Apply</a>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div th:if="${jobs == null or #lists.isEmpty(jobs)}" class="text-muted">No jobs available.</div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

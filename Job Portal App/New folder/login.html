<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Login - JobFair</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" th:href="@{/}">JobFair+</a>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card p-4 shadow-sm">
          <div class="d-flex">
            <div class="flex-fill pe-4 border-end">
              <h4 class="mb-3">Job Seeker</h4>
              <form th:action="@{/login}" method="post" th:object="${loginForm}">
                <input type="hidden" name="role" value="JOBSEEKER"/>
                <div class="mb-3">
                  <label class="form-label">Email</label>
                  <input th:field="*{email}" class="form-control" placeholder="you@example.com" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Password</label>
                  <input th:field="*{password}" type="password" class="form-control" placeholder="Password" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Login as Seeker</button>
              </form>
            </div>

            <div class="flex-fill ps-4">
              <h4 class="mb-3">Company</h4>
              <form th:action="@{/login}" method="post" th:object="${loginForm}">
                <input type="hidden" name="role" value="COMPANY"/>
                <div class="mb-3">
                  <label class="form-label">Company Email</label>
                  <input th:field="*{email}" class="form-control" placeholder="hr@company.com" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Password</label>
                  <input th:field="*{password}" type="password" class="form-control" placeholder="Password" required>
                </div>
                <button class="btn btn-outline-primary w-100" type="submit">Login as Company</button>
                 </form>
            </div>
          </div>

          <div class="mt-3 text-center">
            <small>Don't have an account? <a th:href="@{/register}">Sign up</a></small>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Events - JobFair</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-white shadow-sm">
    <div class="container">
      <a class="navbar-brand text-primary" th:href="@{/}">JobFair+</a>
      <div>
        <a class="btn btn-outline-primary" th:href="@{/events/new}">Create Event</a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h3 class="mb-3">Upcoming Events</h3>
    <div class="row g-3">
      <div class="col-md-4" th:each="ev : ${events}">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title" th:text="${ev.eventTitle}">Campus Recruitment</h5>
            <p class="card-text small text-muted" th:text="${#dates.format(ev.date,'dd MMM yyyy')}">01 Nov 2025</p>
            <p th:text="${ev.description}" class="card-text">Short detail...</p>
          </div>
          <div class="card-footer bg-white d-flex justify-content-between align-items-center">
            <a th:href="@{|/events/${ev.eventId}|}" class="btn btn-sm btn-outline-primary">View</a>
            <a th:href="@{|/events/${ev.eventId}/register|}" class="btn btn-sm btn-primary">Register</a>
          </div>
        </div>
      </div>

      <div class="col-12" th:if="${events == null or #lists.isEmpty(events)}">
        <div class="alert alert-info">No events scheduled.</div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
